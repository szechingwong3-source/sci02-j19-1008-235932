name: benchmark
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write benchmark result
        shell: bash
        run: printf '%s' '{"scores":[2,4,6,8],"mean":5}' > benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark
          path: benchmark.json
